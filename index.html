<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celesta Observatory</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="stars-layer layer1"></div>
  <div class="stars-layer layer2"></div>
  <div class="hud">
    <div>OBJECT: CELESTA</div>
    <div>STATUS: ACTIVE</div>
    <div>COORDINATES: 21.12° N 78.65° E</div>
    <div>AUDIO : NASA APPOLO MISSION 11</div>
    <div class="soundstatus"><button><span style=" font-size: 10px;  border-radius: 6px; padding: 2px;">▶</span></button>
      <- CLick here to listen and begin
    </div>
      <audio id="myAudio" src="appolo.mp3"></audio>

  </div>

  <h1>CELESTA</h1>
<div class="hubble"></div>
<button class="sign up" id="sign-up">SIGN UP</button>
<button class="sign in" id="sign-in">SIGN IN</button>
<!--popup-->

<div class="popup">
  <div class="popup-signin">
    <h2>Sign In</h2>
  <input type="text" placeholder="Username"><br>
  <input type="password" placeholder="Password"><br>
</div>
<div class="popup-signup">
    <h2>Sign Up</h2>
  <input type="text" placeholder="Username"><br>
  <input type="email" placeholder="Email"><br>
  <input type="password" placeholder="Password"><br>
</div>

  <button id="submit" class="popupbtn">Submit</button>
  <button id="close"  class="popupbtn">Close</button>
</div>


</body>
<script src="galaxy.js"></script>

</html>
